```html
<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <title>لوحة متابعة تسجيل الطلاب</title>

  <link rel="stylesheet" href="style.css">

  <style>
    .admin-header {
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:15px;
      flex-wrap:wrap;
    }

    .admin-link {
      text-decoration:none;
    }

    .stats {
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:15px;
      margin-bottom:20px;
    }

    .stat {
      background:#fff;
      border-radius:15px;
      padding:20px;
      text-align:center;
      box-shadow:0 5px 20px rgba(0,0,0,.08);
    }

    .stat b {
      display:block;
      font-size:30px;
      margin-bottom:8px;
    }

    .toolbar {
      display:grid;
      grid-template-columns:2fr 1fr 1fr auto auto;
      gap:10px;
      align-items:center;
      margin-bottom:15px;
    }

    .toolbar input,
    .toolbar select {
      width:100%;
      box-sizing:border-box;
    }

    .table-wrap {
      overflow-x:auto;
    }

    table {
      width:100%;
      border-collapse:collapse;
      min-width:1400px;
    }

    th,
    td {
      padding:10px 8px;
      border-bottom:1px solid #eee;
      text-align:center;
      white-space:nowrap;
    }

    th {
      background:#f5f7fa;
    }

    .badge {
      display:inline-block;
      padding:5px 10px;
      border-radius:20px;
      font-size:13px;
      font-weight:bold;
    }

    .badge.ok {
      background:#dff7e7;
      color:#16733a;
    }

    .badge.no {
      background:#ffe3e3;
      color:#a52020;
    }

    .details-btn,
    .cancel-btn {
      border:0;
      border-radius:8px;
      padding:7px 11px;
      cursor:pointer;
      color:#fff;
      font-weight:bold;
      margin:2px;
    }

    .details-btn {
      background:#1976d2;
    }

    .cancel-btn {
      background:#c62828;
    }

    .empty {
      padding:30px;
      text-align:center;
      color:#777;
    }

    .modal {
      position:fixed;
      inset:0;
      background:rgba(0,0,0,.55);
      display:flex;
      align-items:center;
      justify-content:center;
      padding:20px;
      z-index:9999;
    }

    .modal.hidden {
      display:none;
    }

    .modal-box {
      background:#fff;
      width:min(600px,100%);
      max-height:90vh;
      overflow-y:auto;
      border-radius:18px;
      padding:25px;
      box-sizing:border-box;
    }

    .modal-box h2 {
      margin-top:0;
    }

    .detail-row {
      display:flex;
      justify-content:space-between;
      gap:20px;
      padding:11px 0;
      border-bottom:1px solid #eee;
    }

    .detail-row span {
      color:#666;
    }

    .detail-row strong {
      text-align:left;
      word-break:break-word;
    }

    .modal-close {
      width:100%;
      margin-top:20px;
    }

    @media(max-width:800px) {
      .stats {
        grid-template-columns:1fr;
      }

      .toolbar {
        grid-template-columns:1fr;
      }

      .admin-header {
        flex-direction:column;
        align-items:stretch;
      }
    }
  </style>
</head>

<body>

<header class="hero">
  <div class="admin-header">

    <div>
      <h1>لوحة متابعة تسجيل الطلاب</h1>
      <p>متابعة الطلاب المسجلين وغير المسجلين</p>
    </div>

    <a class="admin-link" href="index.html">
      صفحة الطلاب
    </a>

  </div>
</header>


<main class="container">

  <!-- تسجيل الدخول -->
  <section id="loginCard" class="card">

    <h2>دخول Admin</h2>

    <form id="loginForm">

      <label for="email">البريد الإلكتروني</label>
      <input
        id="email"
        type="email"
        autocomplete="username"
        required
      >

      <label for="password">كلمة المرور</label>
      <input
        id="password"
        type="password"
        autocomplete="current-password"
        required
      >

      <button type="submit" class="primary-btn">
        دخول
      </button>

    </form>

    <div id="loginMsg"></div>

  </section>


  <!-- لوحة التحكم -->
  <section id="dashboard" class="hidden">

    <div class="stats">

      <div class="stat">
        <b id="total">0</b>
        <span>إجمالي الطلاب</span>
      </div>

      <div class="stat">
        <b id="registered">0</b>
        <span>المسجلون</span>
      </div>

      <div class="stat">
        <b id="unregistered">0</b>
        <span>غير المسجلين</span>
      </div>

    </div>


    <section class="card">

      <div class="toolbar">

        <input
          id="search"
          type="search"
          placeholder="بحث بالاسم أو الكود أو الرقم القومي..."
        >

        <select id="status">
          <option value="all">كل الحالات</option>
          <option value="registered">مسجل</option>
          <option value="unregistered">غير مسجل</option>
        </select>

        <select id="classFilter">
          <option value="all">كل الفصول</option>
        </select>

        <button id="exportBtn" type="button">
          تصدير Excel
        </button>

        <button id="logoutBtn" type="button" class="secondary">
          خروج
        </button>

      </div>


      <div class="table-wrap">

        <table>

          <thead>
            <tr>
              <th>#</th>
              <th>الاسم</th>
              <th>الكود</th>
              <th>الفصل</th>
              <th>رقم الملف</th>
              <th>الرقم القومي</th>
              <th>هاتف الطالب</th>
              <th>اسم ولي الأمر</th>
              <th>هاتف ولي الأمر</th>
              <th>العنوان</th>
              <th>الحالة</th>
              <th>الإجراءات</th>
            </tr>
          </thead>

          <tbody id="rows"></tbody>

        </table>

      </div>

    </section>

  </section>

</main>


<!-- نافذة التفاصيل -->

<div id="detailsModal" class="modal hidden">

  <div class="modal-box">

    <h2>تفاصيل تسجيل الطالب</h2>

    <div id="detailsContent"></div>

    <button
      id="closeDetails"
      type="button"
      class="secondary modal-close"
    >
      إغلاق
    </button>

  </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="admin.js"></script>

</body>
</html>
```
