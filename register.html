```html
<!doctype html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <title>استكمال بيانات الطالب</title>

  <link rel="stylesheet" href="style.css">

  <style>
    #studySystemMessage {
      display: none;
      margin: 12px 0;
      padding: 12px 15px;
      border-radius: 10px;
      font-weight: 700;
      text-align: center;
      font-size: 16px;
    }

    #studySystemMessage.error {
      display: block;
      color: #8f3838;
      background: #f9e7e4;
      border: 1px solid #efc9c4;
    }

    #studySystemMessage.success {
      display: block;
      color: #286149;
      background: #e5f2eb;
      border: 1px solid #c8e2d3;
    }
  </style>
</head>


<body>

<header class="hero">
  <div>
    <h1>استكمال بيانات الطالب</h1>
    <p>الصف الأول الثانوي 2026-2027</p>
  </div>
</header>


<main class="container">


  <section class="card">

    <h2>بيانات الطالب</h2>

    <div class="grid">

      <div>
        <span>الاسم</span>
        <strong id="sName"></strong>
      </div>

      <div>
        <span>كود الطالب</span>
        <strong id="sCode"></strong>
      </div>

      <div>
        <span>الفصل</span>
        <strong id="sClass"></strong>
      </div>

      <div>
        <span>رقم الملف بالمدرسة</span>
        <strong id="sFile"></strong>
      </div>

      <div>
        <span>الرقم القومي</span>
        <strong id="sNational"></strong>
      </div>

    </div>

  </section>


  <section class="card">

    <h2>استكمال البيانات</h2>

    <form id="registerForm">


      <label for="studySystem">
        نظام الدراسة
      </label>


      <select id="studySystem" required>

        <option value="">
          اختر نظام الدراسة
        </option>

        <option value="بكالوريا">
          بكالوريا
        </option>

        <option value="ثانوية عامة">
          ثانوية عامة
        </option>

      </select>


      <!-- الرسالة تظهر هنا فوراً -->
      <div id="studySystemMessage"></div>


      <label for="studentPhone">
        رقم تليفون الطالب (واتساب)
      </label>

      <input
        id="studentPhone"
        type="tel"
        inputmode="numeric"
        maxlength="11"
        autocomplete="tel"
        placeholder="01xxxxxxxxx"
        required
      >


      <label for="guardianName">
        اسم ولي الأمر
      </label>

      <input
        id="guardianName"
        type="text"
        autocomplete="name"
        pattern="[A-Za-z؀-ۿ\s]+"
        title="اكتب اسم ولي الأمر بالحروف فقط"
        required
      >


      <label for="guardianPhone">
        رقم ولي الأمر (واتساب)
      </label>

      <input
        id="guardianPhone"
        type="tel"
        inputmode="numeric"
        maxlength="11"
        autocomplete="tel"
        placeholder="01xxxxxxxxx"
        required
      >


      <label for="address">
        العنوان بالتفصيل
      </label>

      <textarea
        id="address"
        rows="4"
        required
      ></textarea>


      <button
        id="saveBtn"
        type="submit"
        class="primary-btn"
      >
        تسجيل البيانات
      </button>


      <div id="message"></div>

    </form>

  </section>

</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="config.js"></script>

<script src="register.js"></script>


<!-- ================================================= -->
<!-- كود نظام الدراسة - يعمل مباشرة داخل الصفحة -->
<!-- ================================================= -->

<script>

document.addEventListener("DOMContentLoaded", function () {

  const studySystem =
    document.getElementById("studySystem");

  const studySystemMessage =
    document.getElementById("studySystemMessage");

  const saveBtn =
    document.getElementById("saveBtn");


  if (!studySystem) {
    console.error("studySystem غير موجود");
    return;
  }


  if (!studySystemMessage) {
    console.error("studySystemMessage غير موجود");
    return;
  }


  studySystem.addEventListener("change", function () {

    const value =
      studySystem.value;


    console.log(
      "تم تغيير نظام الدراسة إلى:",
      value
    );


    /* ثانوية عامة */

    if (value === "ثانوية عامة") {

      studySystemMessage.textContent =
        "عفواً، هذا النظام غير متاح بمدرستك.";

      studySystemMessage.className =
        "error";

      saveBtn.disabled = true;

      return;
    }


    /* بكالوريا */

    if (value === "بكالوريا") {

      studySystemMessage.textContent =
        "تم اختيار نظام البكالوريا.";

      studySystemMessage.className =
        "success";

      saveBtn.disabled = false;

      return;
    }


    /* لم يتم الاختيار */

    studySystemMessage.textContent = "";

    studySystemMessage.className = "";

    saveBtn.disabled = false;

  });

});

</script>


</body>
</html>
```
