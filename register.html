<!doctype html>
<html lang="ar" dir="rtl">

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  >

  <title>استكمال بيانات الطالب</title>

  <link rel="stylesheet" href="style.css">

</head>


<body>


<header class="hero">

  <div>

    <h1>
      استكمال بيانات الطالب
    </h1>

    <p>
      الصف الأول الثانوي 2026-2027
    </p>

  </div>

</header>


<main class="container">


  <!-- بيانات الطالب -->

  <section class="card">

    <h2>
      بيانات الطالب
    </h2>


    <div class="grid">


      <div>

        <span>
          الاسم
        </span>

        <strong id="sName"></strong>

      </div>


      <div>

        <span>
          كود الطالب
        </span>

        <strong id="sCode"></strong>

      </div>


      <div>

        <span>
          الفصل
        </span>

        <strong id="sClass"></strong>

      </div>


      <div>

        <span>
          رقم الملف بالمدرسة
        </span>

        <strong id="sFile"></strong>

      </div>


      <div>

        <span>
          الرقم القومي
        </span>

        <strong id="sNational"></strong>

      </div>


    </div>

  </section>


  <!-- استكمال البيانات -->

  <section class="card">

    <h2>
      استكمال البيانات
    </h2>


    <form id="registerForm">


      <label for="studentPhone">
        رقم تليفون الطالب (واتساب)
      </label>

      <input
        id="studentPhone"
        type="tel"
        inputmode="numeric"
        maxlength="11"
        autocomplete="tel"
        placeholder="01xxxxxxxxx"
        required
      >


      <label for="guardianName">
        اسم ولي الأمر
      </label>

      <input
        id="guardianName"
        type="text"
        autocomplete="name"
        required
      >


      <label for="guardianPhone">
        رقم ولي الأمر (واتساب)
      </label>

      <input
        id="guardianPhone"
        type="tel"
        inputmode="numeric"
        maxlength="11"
        autocomplete="tel"
        placeholder="01xxxxxxxxx"
        required
      >


      <label for="address">
        العنوان
      </label>

      <textarea
        id="address"
        rows="4"
        required
      ></textarea>


      <button
        id="saveBtn"
        type="submit"
        class="primary-btn"
      >
        تسجيل البيانات
      </button>


      <div id="message"></div>


    </form>

  </section>


</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="register.js"></script>


</body>
</html>
